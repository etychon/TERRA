[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terra-sdwan-dashboard"
version = "0.0.0"
description = "TERRA — Dashboard Telemetry for Edge and Remote Routable Assets (Cisco Catalyst SD-WAN)"
readme = "README.md"
license = { text = "Cisco Sample Code License, Version 1.1" }
requires-python = ">=3.11"
authors = [{ name = "TERRA Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
