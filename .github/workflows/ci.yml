name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tooling
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src/terra src/terra_sdwan tests

      - name: Mypy
        run: mypy src/terra src/terra_sdwan tests

      - name: Pytest
        run: pytest

      - name: Docker Compose config
        run: docker compose config

      - name: Docker Compose build
        run: docker compose build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install, build devices grid, and verify frontend
        run: npm ci && npm run build -w terra-dashboard-frontend && npm run lint && npm run test -w terra-dashboard-frontend

  e2e-devices-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          npm run build -w terra-dashboard-frontend
          npx playwright install chromium --with-deps
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Playwright smoke (devices grid)
        env:
          TERRA_SECRET_KEY: dev-local-terra-secret-key-32charmin!
          TERRA_ADMIN_EMAIL: admin@test.tld
          TERRA_ADMIN_PASSWORD: ChangeMe!Admin-1st-login
        run: |
          uvicorn terra.main:app --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/health && break
            sleep 1
          done
          TERRA_E2E_BASE_URL=http://127.0.0.1:8765 npm run test:e2e
