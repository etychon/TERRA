{% extends "base.html" %}
{% block header_nav %}
<a href="/auth/login">Sign in</a>
{% endblock %}
{% block content %}
<div class="terra-card">
  <div class="terra-card-accent" aria-hidden="true"></div>
  <div class="terra-card-inner">
    <p class="terra-lead"><strong>Password reset</strong> — request a link. Without outbound email, tokens are logged server-side.</p>
    {% if info %}
    <div class="terra-alert terra-alert-info">{{ info }}</div>
    {% endif %}
    {% if error %}
    <div class="terra-alert terra-alert-error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/auth/forgot-password" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="terra-field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <button class="terra-btn" type="submit">Send reset</button>
    </form>
    <div class="terra-links"><a href="/auth/login">Back to sign in</a></div>
  </div>
</div>
{% endblock %}
