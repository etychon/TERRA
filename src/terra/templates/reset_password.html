{% extends "base.html" %}
{% block header_nav %}
<a href="/auth/login">Sign in</a>
{% endblock %}
{% block content %}
<div class="terra-card">
  <div class="terra-card-accent" aria-hidden="true"></div>
  <div class="terra-card-inner">
    <p class="terra-lead"><strong>New password</strong> — choose a password for your account.</p>
    {% if error %}
    <div class="terra-alert terra-alert-error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/auth/reset-password" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <input type="hidden" name="token" value="{{ token }}" />
      <div class="terra-field">
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" required minlength="10" autocomplete="new-password" />
      </div>
      <button class="terra-btn" type="submit">Update password</button>
    </form>
    <div class="terra-links"><a href="/auth/login">Back to sign in</a></div>
  </div>
</div>
{% endblock %}
