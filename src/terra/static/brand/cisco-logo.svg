<?xml version="1.0" encoding="UTF-8"?>
<!-- Simplified Cisco bridge mark + wordmark for TERRA auth UI. Production: replace with assets from Cisco Brand Center. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 36" role="img" aria-labelledby="ciscoLogoTitle">
  <title id="ciscoLogoTitle">Cisco Systems</title>
  <style>
    .bar { fill: #049FD9; }
    .word { fill: #049FD9; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  </style>
  <g transform="translate(0,2)">
    <rect class="bar" x="0" y="10" width="2.2" height="14" rx="0.4"/>
    <rect class="bar" x="3.5" y="6" width="2.2" height="22" rx="0.4"/>
    <rect class="bar" x="7" y="8" width="2.2" height="18" rx="0.4"/>
    <rect class="bar" x="10.5" y="4" width="2.2" height="26" rx="0.4"/>
    <rect class="bar" x="14" y="8" width="2.2" height="18" rx="0.4"/>
    <rect class="bar" x="17.5" y="6" width="2.2" height="22" rx="0.4"/>
    <rect class="bar" x="21" y="10" width="2.2" height="14" rx="0.4"/>
    <rect class="bar" x="24.5" y="12" width="2.2" height="10" rx="0.4"/>
    <rect class="bar" x="28" y="10" width="2.2" height="14" rx="0.4"/>
  </g>
  <text class="word" x="36" y="23">cisco</text>
</svg>
